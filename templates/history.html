<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史记录</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h3>📜 历史记录</h3>

<div class="card">

<table>

<tr>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>前</th>
<th>后</th>
<th>时间</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
