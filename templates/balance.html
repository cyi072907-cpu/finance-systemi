<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit管理</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h2>💳 Credit 管理</h2>

<div class="card">

<form method="POST">

<input name="account" placeholder="账号">
<input name="credit" placeholder="手动设置Credit">

<button>更新Credit</button>

</form>

</div>

<div class="card">

{% for r in data %}
<p>账号：{{r[0]}} ｜ Credit：{{r[1]}}</p>
{% endfor %}

</div>

</div>

</body>
</html>
