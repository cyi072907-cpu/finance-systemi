<!DOCTYPE html>
<html>
<head>
<title>HUAT888 Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>HUAT888 财务系统</h2>

<div class="grid">

<div class="box">
💰 总余额
<h3>{{ balance }}</h3>
</div>

<div class="box">
📊 今日收支
</div>

<div class="box">
📜 历史记录
</div>

<div class="box">
💳 付款统计
</div>

</div>

<div class="card">

<h3>新增记录</h3>

<form action="/add" method="post">

<input
name="account"
placeholder="账号"
required>

<input
name="amount"
placeholder="金额"
required>

<select name="payment_method">

<option>BANK</option>
<option>TNG</option>
<option>CASH</option>
<option>A</option>

</select>

<input
name="remark"
placeholder="备注">

<button type="submit">
保存
</button>

</form>

</div>

</body>
</html>
