<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>V5 PRO FINAL</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.container{padding:15px;}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-weight:bold;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid #333;
    font-size:12px;
}

.green{color:#22c55e;}
.red{color:#ef4444;}

.big{
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>💰 总余额</h2>
<div class="big">{{total}}</div>
</div>

<div class="card">
<form method="post" action="/add">

<input name="account" placeholder="账号">
<input name="amount" placeholder="金额">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OUT</option>
</select>

<input name="note" placeholder="备注">

<button>提交</button>

</form>
</div>

<div class="card">
<h3>最近记录</h3>

{% for r in data %}
<div class="row">
<span>{{r[1]}}</span>
<span class="{% if r[2] < 0 %}red{% else %}green{% endif %}">
{{r[2]}}
</span>
<span>{{r[3]}}</span>
<span>{{r[7]}}</span>
</div>
{% endfor %}

</div>

</div>

</body>
</html>
