<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUAT888 DASHBOARD</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h3>💰 总余额：{{total}}</h3>

<div class="grid">

<a class="card">
📈 今日交易<br>{{today_count}}笔
</a>

<a class="card" href="/report">
📊 盈亏<br>{{today_profit}}
</a>

<a class="card" href="/history">
📜 历史记录
</a>

<a class="card" href="#payment">
💳 付款统计
</a>

</div>

<!-- 添加记录 -->
<div class="card">
<form method="POST" action="/add">

<input name="account" placeholder="账号">
<input name="amount" placeholder="金额">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OTHER</option>
<option>OUT</option>
</select>

<input name="note" placeholder="备注">

<button>提交</button>

</form>
</div>

</div>

</body>
</html>
