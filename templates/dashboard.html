<h2>💰 V5 PRO 控制台</h2>

<p>总盈亏：{{ total }}</p>

<form method="POST" action="/add">
<input name="account" placeholder="账号">
<input name="amount" placeholder="金额">

<select name="payment">
<option value="CASH">CASH</option>
<option value="TNG">TNG</option>
<option value="BANK">BANK</option>
<option value="OUT">出金</option>
</select>

<input name="note" placeholder="备注">
<button>提交</button>
</form>

<hr>

<table border="1">
<tr>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>备注</th>
<th>前</th>
<th>后</th>
<th>时间</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
</tr>
{% endfor %}
</table>
