<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUAT888 DASHBOARD</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h2>💰 HUAT888 财务系统</h2>

<!-- ================= 2x2 四宫格 ================= -->
<div class="grid">

<div class="card">
📊 今日交易<br>
{{today_count}} 笔
</div>

<div class="card">
📈 盈亏<br>
{{today_profit}}
</div>

<div class="card">
💳 总余额 / Credit<br>
{{total}}
</div>

<div class="card">
📜 历史记录
</div>

</div>

<!-- ================= 付款统计（可展开） ================= -->
<div class="card">
<h3 onclick="togglePay()">📦 付款统计 (点击展开)</h3>

<div id="payBox" style="display:none;">
{% for p in payment_stat %}
<p>{{p[0]}} : {{p[1]}}</p>
{% endfor %}
</div>
</div>

<!-- ================= 添加记录 ================= -->
<div class="card" id="add">

<form method="POST" action="/add">

<input name="account" placeholder="账号">
<input name="amount" placeholder="金额">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OTHER</option>
<option>OUT</option>
</select>

<input name="note" placeholder="备注">

<button>提交</button>

</form>

</div>

<!-- ================= 最近记录 ================= -->
<div class="card">

<h3>📌 最近记录</h3>

<table>
<tr>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>前</th>
<th>后</th>
<th>时间</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
</tr>
{% endfor %}

</table>

</div>

</div>

<script>
function togglePay(){
    var box = document.getElementById("payBox");
    if(box.style.display === "none"){
        box.style.display = "block";
    }else{
        box.style.display = "none";
    }
}
</script>

</body>
</html>
