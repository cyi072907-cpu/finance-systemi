<!DOCTYPE html>
<html>
<head>
<title>HUAT888 Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="top-bar">
    <h2>HUAT888 财务系统</h2>
    <a href="/settings">⚙️ 设置</a>
</div>

<div class="grid">

    <div class="box">
        <div class="title">💰 总余额</div>
        <h3>RM {{ "%.2f"|format(balance) }}</h3>
    </div>

    <div class="box">
        <div class="title">📊 今日收支</div>
        <p>开发中</p>
    </div>

    <div class="box">
        <div class="title">📜 历史记录</div>
        <p>{{ records|length }} 条</p>
    </div>

    <div class="box">
        <div class="title">💳 付款统计</div>
        <p>开发中</p>
    </div>

</div>

<div class="card">

<h3>新增记录</h3>

<form action="/add" method="post">

<input
name="account"
placeholder="账号"
required>

<input
name="amount"
placeholder="金额"
required>

<select name="payment_method">
<option>BANK</option>
<option>TNG</option>
<option>CASH</option>
<option>A</option>
</select>

<input
name="remark"
placeholder="备注">

<button type="submit">
保存记录
</button>

</form>

</div>

<div class="card">

<h3>最近记录</h3>

<table>

<tr>
<th>账号</th>
<th>金额</th>
</tr>

{% for row in records %}

<tr>
<td>{{ row.account }}</td>
<td>{{ row.amount }}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
