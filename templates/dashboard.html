<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>资金管理系统</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0f172a;
    color:white;
}

.container{
    padding:15px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-weight:bold;
}

table{
    width:100%;
    font-size:12px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
}

td,th{
    padding:6px;
    text-align:center;
    border-bottom:1px solid #333;
}

.edit{
    color:yellow;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h2>💰 资金管理系统 V5 Pro</h2>

<!-- 总金额 -->
<div class="card">
<h3>总余额：{{total}}</h3>
</div>

<!-- 输入表单 -->
<div class="card">
<form action="/add" method="post">

<input name="account" placeholder="账号">

<input name="amount" placeholder="金额">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OUT</option>
</select>

<input name="note" placeholder="备注">

<button>提交记录</button>
</form>
</div>

<!-- 数据表 -->
<div class="card">

<table>

<tr>
<th>ID</th>
<th>账号</th>
<th>金额</th>
<th>付款方式</th>
<th>扣前余额</th>
<th>扣后余额</th>
<th>时间</th>
<th>修改</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
<td>
<a class="edit" href="/update_payment/{{r[0]}}/CASH">改C</a>
<a class="edit" href="/update_payment/{{r[0]}}/TNG">改T</a>
<a class="edit" href="/update_payment/{{r[0]}}/BANK">改B</a>
</td>
</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
