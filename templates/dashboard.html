<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUAT888 DASHBOARD</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h3>💰 HUAT888 财务系统</h3>

<!-- ================= 四宫格 ================= -->
<div class="grid">

<!-- 1. CREDIT -->
<div class="card">
<h4>💰 总余额</h4>
<h2>{{total}}</h2>
</div>

<!-- 2. 盈亏 -->
<div class="card">
<h4>📊 盈亏</h4>
<h2>{{today_profit}}</h2>
</div>

<!-- 3. 历史记录 -->
<a class="card" href="/history">
📜 历史记录
</a>

<!-- 4. 付款统计（折叠） -->
<div class="card">
<h4>💳 付款统计</h4>

{% for k,v in payment_stat.items() %}
<div>{{k}} : {{v}}</div>
{% endfor %}

</div>

</div>

<!-- ================= 输入 ================= -->
<div class="card">
<form method="POST" action="/add">

<input name="account" placeholder="账号">
<input name="amount" placeholder="金额">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OTHER</option>
<option>OUT</option>
</select>

<input name="note" placeholder="备注">

<button>提交</button>

</form>
</div>

<!-- ================= 今日交易 ================= -->
<div class="card">
<h3>📈 今日交易：{{today_count}} 笔</h3>
</div>

<!-- ================= 最近记录 ================= -->
<div class="card">

<h3>📌 最近记录</h3>

<table>
<tr>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>前</th>
<th>后</th>
<th>时间</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
</tr>
{% endfor %}
</table>

</div>

</div>

</body>
</html>
