<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V5 PRO CLEAN</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.container{padding:12px}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px}
button{width:100%;padding:10px;background:#22c55e;color:white;border:none;border-radius:8px}
table{width:100%;font-size:12px;background:#111827;border-radius:10px}
td,th{padding:6px;text-align:center;border-bottom:1px solid #333}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>💰 V5 PRO CLEAN</h2>
<h3>总余额：{{total}}</h3>
</div>

<div class="card">
<form action="/add" method="post">
<input name="account" placeholder="账号">
<input name="amount" placeholder="金额">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OTHER</option>
<option>OUT</option>
</select>

<input name="note" placeholder="备注">
<button>提交</button>
</form>
</div>

<div class="card">
<table>
<tr>
<th>ID</th><th>账号</th><th>金额</th><th>付款</th><th>前</th><th>后</th><th>时间</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>
<a href="/update_payment/{{r[0]}}/CASH">C</a>
<a href="/update_payment/{{r[0]}}/TNG">T</a>
<a href="/update_payment/{{r[0]}}/BANK">B</a>
</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
</tr>
{% endfor %}
</table>
</div>

</div>
</body>
</html>
