<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Finance App</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0f172a;
    color:white;
}

.container{
    padding:15px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
}

table{
    width:100%;
    font-size:12px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
}

td,th{
    padding:6px;
    text-align:center;
    border-bottom:1px solid #333;
}

.edit{
    color:yellow;
}
</style>
</head>

<body>

<div class="container">

<h2>💰 Finance App V5 Pro</h2>

<div class="card">
<h3>Total: {{total}}</h3>
</div>

<div class="card">
<form action="/add" method="post">
<input name="account" placeholder="Account">
<input name="amount" placeholder="Amount">

<select name="payment">
<option>CASH</option>
<option>TNG</option>
<option>BANK</option>
<option>OUT</option>
</select>

<input name="note" placeholder="Note">
<button>Submit</button>
</form>
</div>

<div class="card">
<table>
<tr>
<th>ID</th>
<th>Acc</th>
<th>Amt</th>
<th>Pay</th>
<th>Before</th>
<th>After</th>
<th>Time</th>
<th>Edit</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[0]}}</td>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td>{{r[6]}}</td>
<td>{{r[7]}}</td>
<td>
<a class="edit" href="/update_payment/{{r[0]}}/CASH">C</a>
<a class="edit" href="/update_payment/{{r[0]}}/TNG">T</a>
<a class="edit" href="/update_payment/{{r[0]}}/BANK">B</a>
</td>
</tr>
{% endfor %}

</table>
</div>

</div>

</body>
</html>
