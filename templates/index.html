<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资金系统</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:10px}
.card{background:white;padding:12px;margin-bottom:10px;border-radius:10px}
input,select,button{width:100%;padding:10px;margin-top:8px}
table{width:100%;background:white;border-collapse:collapse;font-size:12px}
td,th{border:1px solid #ddd;padding:5px;text-align:center}
</style>
</head>

<body>

<div class="card">
<h2>💰 资金系统</h2>
<p>当前余额：<b>{{balance}}</b></p>
<a href="/logout">退出</a>
</div>

<div class="card">
<h3>📊 盈亏统计</h3>
<p>起始：{{start}}</p>
<p>当前：{{balance}}</p>
<p>盈利/亏损：{{profit}}</p>
</div>

<div class="card">
<form action="/add" method="POST">
<input name="amount" placeholder="+100 / -100" required>

<select name="payment">
<option>TNG</option>
<option>Cash</option>
<option>Bank</option>
<option>人名</option>
</select>

<input name="remark" placeholder="备注">

<button type="submit">提交</button>
</form>
</div>

<div class="card">
<table>
<tr>
<th>时间</th>
<th>金额</th>
<th>付款</th>
<th>备注</th>
<th>余额</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
</tr>
{% endfor %}

</table>
</div>

</body>
</html>
<div class="card">
<a href="/reports">📊 报表中心</a><br><br>
<a href="/search">🔍 日期查询</a>
</div>
