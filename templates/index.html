<!DOCTYPE html>
<html>
<head>
    <title>Finance System V6</title>
    <style>
        body { font-family: Arial; background:#111; color:#fff; }
        .box { width:900px; margin:auto; }
        table { width:100%; border-collapse: collapse; margin-top:20px; }
        th,td { border:1px solid #333; padding:8px; text-align:center; }

        input,select { padding:8px; margin:5px; }
        button { padding:8px 12px; cursor:pointer; }

        .pos { color:#00ff88; font-size:22px; }
        .neg { color:#ff4d4d; font-size:22px; }
    </style>
</head>

<body>
<div class="box">

    <h2>💰 Finance System V6 (Stable)</h2>

    <h3>
        Balance:
        <span class="{{ 'pos' if balance >= 0 else 'neg' }}">
            {{ balance }}
        </span>
    </h3>

    <form action="/add" method="post">
        <input name="account" placeholder="Account" required>
        <input name="amount" placeholder="Amount" required>

        <select name="type">
            <option value="in">IN +</option>
            <option value="out">OUT -</option>
        </select>

        <button type="submit">Add</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Account</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Time</th>
            <th>Delete</th>
            <th>Balance</th>
        </tr>

        {% for r in records %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.account }}</td>
            <td>{{ r.amount }}</td>
            <td>{{ r.type }}</td>
            <td>{{ r.time }}</td>
            <td><a href="/delete/{{ r.id }}" style="color:red">X</a></td>
            <td>{{ r.balance }}</td>
        </tr>
        {% endfor %}
    </table>

</div>
</body>
</html>
