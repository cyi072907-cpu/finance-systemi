<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统</title>
</head>

<body style="font-family:Arial;padding:10px">

<h2>💰 Credit：{{credit}}</h2>

<a href="/reports">📊 报表</a> |
<a href="/search">🔍 查询</a> |
<a href="/logout">退出</a>

<hr>

<form action="/add" method="POST">
<input name="account" placeholder="账号"><br><br>
<input name="amount" placeholder="+100 / -100"><br><br>

<select name="payment">
<option>TNG</option>
<option>Cash</option>
<option>Bank</option>
<option>Name</option>
</select><br><br>

<input name="remark" placeholder="备注"><br><br>

<button>提交</button>
</form>

<hr>

<table border="1" width="100%">
<tr>
<th>时间</th>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>备注</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
