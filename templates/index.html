<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Boss System</title>

<!-- PWA -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    margin:0;
}

/* 顶部 */
.header{
    padding:15px;
    font-size:18px;
    font-weight:bold;
    background:#111827;
}

/* 卡片 */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.card{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
}

/* 盈亏颜色 */
.profit-positive{
    color:#22c55e;
    font-size:22px;
    font-weight:bold;
}

.profit-negative{
    color:#ef4444;
    font-size:22px;
    font-weight:bold;
}

/* 按钮 */
button{
    background:#22c55e;
    border:none;
    padding:10px;
    color:white;
    border-radius:8px;
    width:100%;
}

/* 表格 */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#1f2937;
    padding:8px;
}

td{
    padding:8px;
    border-bottom:1px solid #222;
}

/* 输入 */
input,select{
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
    border:none;
}

a{
    color:#38bdf8;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
💰 Boss Finance System
</div>

<!-- 卡片 -->
<div class="grid">

<div class="card">
<h3>Credit</h3>
<h2>{{credit}}</h2>
</div>

<div class="card">
<h3>今日盈亏</h3>
<h2 class="{% if profit >= 0 %}profit-positive{% else %}profit-negative{% endif %}">
{{profit}}
</h2>
</div>

<div class="card">
<h3>TNG</h3>
<h2>{{tng}}</h2>
</div>

<div class="card">
<h3>CASH</h3>
<h2>{{cash}}</h2>
</div>

<div class="card">
<h3>BANK</h3>
<h2>{{bank}}</h2>
</div>

<div class="card">
<h3>A</h3>
<h2>{{a}}</h2>
</div>

</div>

<!-- 添加 -->
<div class="card" style="margin:10px;">
<h3>➕ Add Record</h3>

<form action="/add" method="POST">
<input name="account" placeholder="Account" required>
<input name="amount" type="number" placeholder="Amount" required>

<select name="payment">
<option>TNG</option>
<option>Cash</option>
<option>Bank</option>
<option>A</option>
</select>

<input name="remark" placeholder="Remark">

<button type="submit">Submit</button>
</form>
</div>

<!-- 记录 -->
<div class="card" style="margin:10px;">
<h3>📌 Records</h3>

<table>
<tr>
<th>Acc</th>
<th>Amt</th>
<th>Pay</th>
<th>Time</th>
<th>Del</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td><a href="/delete/{{r[0]}}">X</a></td>
</tr>
{% endfor %}
</table>
</div>

<!-- PWA 注册 -->
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/service-worker.js")
    .then(() => console.log("PWA Ready"));
}
</script>

</body>
</html>
