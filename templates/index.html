<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:10px}
.card{background:white;padding:10px;margin:10px;border-radius:10px}
input,select,button{width:100%;padding:10px;margin-top:5px}
table{width:100%;background:white;margin-top:10px;border-collapse:collapse}
td,th{border:1px solid #ddd;padding:5px;font-size:12px}
</style>
</head>

<body>

<div class="card">
<h3>💰 Balance: {{balance}}</h3>
<a href="/logout">Logout</a>
</div>

<div class="card">
<form action="/add" method="POST">
<input name="amount" placeholder="+100 / -100" required>

<select name="payment">
<option>TNG</option>
<option>Cash</option>
<option>Bank</option>
<option>Name</option>
</select>

<input name="remark" placeholder="Remark">

<button type="submit">Submit</button>
</form>
</div>

<div class="card">
<table>
<tr>
<th>Time</th>
<th>Amount</th>
<th>Payment</th>
<th>Remark</th>
<th>Balance</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
</tr>
{% endfor %}

</table>
</div>

</body>
</html>
