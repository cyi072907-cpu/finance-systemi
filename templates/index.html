<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业管理系统</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.header {
    padding: 15px;
    background: #111827;
    font-size: 20px;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

.card {
    background: #1f2937;
    padding: 15px;
    border-radius: 12px;
}

button {
    background: #22c55e;
    border: none;
    padding: 10px;
    color: white;
    border-radius: 8px;
    margin: 5px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #111827;
    margin-top: 10px;
}

th {
    background: #1f2937;
    padding: 8px;
}

td {
    padding: 8px;
    border-bottom: 1px solid #222;
}

a {
    color: #38bdf8;
    margin-right: 10px;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">💰 企业管理系统</div>

<div class="grid">

<div class="card">
<h3>Credit</h3>
<h2>{{credit}}</h2>
</div>

<div class="card">
<h3>今日盈亏</h3>
<h2 style="color: {{ 'lime' if profit_status=='green' else 'red' }}">
{{profit}}
</h2>
</div>

<div class="card"><h3>TNG</h3><h2>{{tng}}</h2></div>
<div class="card"><h3>CASH</h3><h2>{{cash}}</h2></div>
<div class="card"><h3>BANK</h3><h2>{{bank}}</h2></div>
<div class="card"><h3>A</h3><h2>{{a}}</h2></div>

</div>

<div style="padding:10px;">
<a href="/close_today" onclick="return confirm('确认结算今天吗？')">🧾 今日结算</a>
<a href="/report/daily">日报</a>
<a href="/report/weekly">周报</a>
<a href="/report/monthly">月报</a>
<a href="/history">历史</a>
</div>

<hr>

<div style="padding:10px;">
<canvas id="myChart"></canvas>
</div>

<script>
new Chart(document.getElementById("myChart"), {
    type: 'bar',
    data: {
        labels: ['TNG','CASH','BANK','A'],
        datasets: [{
            label: 'Balance',
            data: [{{tng}},{{cash}},{{bank}},{{a}}],
            backgroundColor: ['#10b981','#f97316','#3b82f6','#a855f7']
        }]
    }
});
</script>

<hr>

<div style="padding:10px;">
<h3>📌 最近记录</h3>

<table>
<tr>
<th>Account</th>
<th>Amount</th>
<th>Payment</th>
<th>Time</th>
<th>Action</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td><a href="/delete/{{r[0]}}" onclick="return confirm('Delete?')">Del</a></td>
</tr>
{% endfor %}
</table>

</div>

</body>
</html>
