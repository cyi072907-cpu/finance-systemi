<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss System</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0}
.card{background:#1f2937;margin:10px;padding:15px;border-radius:10px}
button{background:#22c55e;border:none;padding:10px;color:white;border-radius:8px}
input,select{width:100%;padding:8px;margin:5px 0}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #333;padding:8px}
a{color:#38bdf8}
</style>
</head>

<body>

<div class="card">
<h2>💰 Credit: {{credit}}</h2>
<h3>📊 今日盈亏: {{profit}}</h3>
</div>

<div class="card">
<h3>➕ Add</h3>

<form action="/add" method="POST">
<input name="account" placeholder="Account">
<input name="amount" type="number" placeholder="Amount">

<select name="payment">
<option>TNG</option>
<option>Cash</option>
<option>Bank</option>
<option>A</option>
</select>

<input name="remark" placeholder="Remark">
<button type="submit">Submit</button>
</form>
</div>

<div class="card">
<h3>📌 Records</h3>

<table>
<tr>
<th>Acc</th>
<th>Amt</th>
<th>Pay</th>
<th>Time</th>
<th>Del</th>
</tr>

{% for r in data %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[5]}}</td>
<td><a href="/delete/{{r[0]}}">X</a></td>
</tr>
{% endfor %}
</table>
</div>

</body>
</html>
