<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>查询</title>
</head>

<body style="font-family:Arial;padding:10px">

<h2>🔍 日期查询</h2>

<form method="POST">
<input type="date" name="date" required>
<button type="submit">查询</button>
</form>

<hr>

<table border="1" width="100%">
<tr>
<th>时间</th>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>备注</th>
</tr>

{% for r in results %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
</tr>
{% endfor %}
</table>

<br>
<a href="/home">返回首页</a>

</body>
</html>
