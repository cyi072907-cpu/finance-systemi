<h2>🔍 查询</h2>

<form method="POST">
<input type="date" name="date">
<button>查询</button>
</form>

<hr>

<table border="1" width="100%">
<tr>
<th>时间</th>
<th>账号</th>
<th>金额</th>
<th>付款</th>
<th>备注</th>
</tr>

{% for r in results %}
<tr>
<td>{{r[1]}}</td>
<td>{{r[2]}}</td>
<td>{{r[3]}}</td>
<td>{{r[4]}}</td>
<td>{{r[5]}}</td>
</tr>
{% endfor %}
</table>
