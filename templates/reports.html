<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盈亏报表</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h2>📊 盈亏报表</h2>

<div class="card">
<h3>💰 总盈亏：{{total}}</h3>
</div>

<div class="card">

<h3>📌 按付款方式统计</h3>

<table>

<tr>
<th>付款方式</th>
<th>金额</th>
</tr>

{% for p in payment %}
<tr>
<td>{{p[0]}}</td>
<td>{{p[1]}}</td>
</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
