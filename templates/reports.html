<h2>{{title}}</h2>

<table border="1" width="100%">
<tr>
    <th>账号</th>
    <th>金额</th>
    <th>付款方式</th>
    <th>时间</th>
</tr>

{% for r in data %}
<tr>
    <td>{{r[0]}}</td>
    <td>{{r[1]}}</td>
    <td>{{r[2]}}</td>
    <td>{{r[3]}}</td>
</tr>
{% endfor %}
</table>
<h2>📊 盈亏报表</h2>

<div class="card">
收入：{{income}}
</div>

<div class="card">
支出：{{expense}}
</div>

<div class="card">
净利润：{{profit}}
</div>
