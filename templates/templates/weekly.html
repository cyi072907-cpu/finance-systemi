<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weekly Report</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    margin:0;
    padding:10px;
}

.card{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

h2{
    margin:0;
}

.profit-positive{ color:#22c55e; }
.profit-negative{ color:#ef4444; }
</style>
</head>

<body>

<h2>📊 Weekly Report</h2>

<div class="card">
<h3>本周总盈亏</h3>

<h1 class="{% if profit >= 0 %}profit-positive{% else %}profit-negative{% endif %}">
{{profit}}
</h1>
</div>

<a href="/home" style="color:#38bdf8;">⬅ Back Home</a>

</body>
</html>
